function rowHtml(a,na){return '<div class="arow" onclick="goDetail(\''+a.id+'\')">'+iconHtml(a)+'<div class="ainfo"><div class="t">'+esc(a.t)+'</div><div class="s">'+esc(a.c)+' · '+esc(a.s)+'</div></div>'+(na?"":actionHtml(a,true))+'</div>';}
function updateRings(id,p){var C1=(2*Math.PI*17);
var els=document.querySelectorAll('[data-pr="'+id+'"]');
for(var k=0;k<els.length;k++)els[k].setAttribute("stroke-dashoffset",(C1*(1-p/100)).toFixed(1));
var f=document.querySelector('[data-fill="'+id+'"]');if(f)f.style.width=p+"%";
var lb=document.querySelector('[data-lb="'+id+'"]');if(lb)lb.textContent=Math.floor(p)+"%";}
function toast(m){var t=document.getElementById("toast");t.textContent=m;t.classList.add("show");clearTimeout(t._h);t._h=setTimeout(function(){t.classList.remove("show");},1700);}
function startDl(id){if(S.dl[id]||S.inst[id])return;S.dl[id]={p:0};save();render();
timers[id]=setInterval(function(){var d=S.dl[id];if(!d){clearInterval(timers[id]);return;}
d.p=Math.min(100,d.p+2+Math.random()*3.2);updateRings(id,d.p);
if(d.p>=100){clearInterval(timers[id]);delete S.dl[id];S.inst[id]=1;if(S.upd[id]){S.updDone[id]=1;delete S.upd[id];}save();render();toast(byId(id).t+" installed");}},130);}
function cancelDl(id){if(timers[id])clearInterval(timers[id]);delete S.dl[id];save();render();toast("Download cancelled");}
function openApp(id){toast("Opening "+byId(id).t+"… (demo)");}
function uninstall(id){delete S.inst[id];save();render();toast(byId(id).t+" uninstalled");}
function goDetail(id){S.detail=id;S.tab="detail";save();render();document.getElementById("sbody").scrollTop=0;}
function goTab(t){S.tab=t;S.detail=null;S.sheet=null;S.lb=null;save();render();document.getElementById("sbody").scrollTop=0;}
function centerChip(){try{var el=document.querySelector(".chips .chip.on");if(el)el.scrollIntoView({behavior:"smooth",inline:"center",block:"nearest"});}catch(e){}}
function setHtab(h){S.htab=h;save();render();centerChip();}
function updCount(){return Object.keys(S.upd).length;}
/* ---------- screens ---------- */
function homeHtml(){var h='<div class="srchrow"><div class="srch" style="flex:1;margin-right:0">'+ICO_SEARCH+'<span style="flex:1" onclick="goTab(\'search\')">Search apps &amp; games</span></div><button class="sicobtn" onclick="goTab(\'settings\')" title="Settings">'+ICO_GEAR+'</button></div>';
h+='<div class="chips"><button class="chip'+(S.htab==="foryou"?" on":"")+'" onclick="setHtab(\'foryou\')">For you</button><button class="chip'+(S.htab==="top"?" on":"")+'" onclick="setHtab(\'top\')">Top charts</button><button class="chip'+(S.htab==="cats"?" on":"")+'" onclick="setHtab(\'cats\')">Categories</button></div>';
if(S.htab==="cats"){var cats={},cg="";
for(var k=0;k<APPS.length;k++){var a=APPS[k];if(!cats[a.c])cats[a.c]=a;}
for(var c in cats){cg+='<button class="cat" onclick="catGo(\''+c.replace(/'/g,"")+'\')"><img src="'+cats[c].i+'"/>'+esc(c)+'</button>';}
h+='<div class="tag">ALL CATEGORIES</div><div class="catgrid">'+cg+'</div>';return h;}
if(S.htab==="top"){h+='<div class="tag">TOP CHARTS</div>';var arr=APPS.slice(0,10);
for(var i2=0;i2<arr.length;i2++)h+=rowHtml(arr[i2],true);return h;}
var f=byId("fgal");
h+='<div class="feat" onclick="goDetail(\''+f.id+'\')"><div class="fb"><div class="fl">FEATURED</div><h3>'+iconHtml(f)+esc(f.t)+'</h3><p>'+esc(f.ab)+'</p></div></div>';
h+='<div class="sec"><span>Recommended for you</span><span class="m" onclick="goTab(\'all\')">More →</span></div>';
var rec=["lark","blackhole","antenna","localsend"];
for(var r=0;r<rec.length;r++)h+=rowHtml(byId(rec[r]),true);
h+='<div class="sec"><span>Trending this week</span><span class="m" onclick="goTab(\'all\')">More →</span></div><div class="hscr>';
var tr=["termux","keepass","obtainium","mpv"];
for(var t2=0;t2<tr.length;t2++){var a2=byId(tr[t2]);
h+='<div class="hcard" onclick="goDetail(\''+a2.id+'\')"><img src="'+a2.i+'"/><div class="t">'+esc(a2.t)+'</div><div class="s">'+esc(a2.c)+' · '+esc(a2.s)+'</div></div>';}
h+='</div>';return h;}
function catGo(c){S.q="";S.tab="search";S.scat=c;save();render();}
function allHtml(){var h='<div class="toolbar"><button class="icobtn" onclick="goTab(\'apps\')">'+ICO_BACK+'</button><span class="tt">All apps</span></div><div class="unote">'+APPS.length+' apps</div>';
for(var k=0;k<APPS.length;k++)h+=rowHtml(APPS[k]);return h;}
function resultsHtml(){var q=S.q.trim().toLowerCase(),out="",n=0;
for(var k=0;k<APPS.length;k++){var a=APPS[k];
if(S.scat&&a.c!==S.scat)continue;
if(q&&a.t.toLowerCase().indexOf(q)<0&&a.c.toLowerCase().indexOf(q)<0)continue;
out+=rowHtml(a);n++;}
if(!n)out='<div class="empty">No apps found.<br>Try another search.</div>';
return out;}
function searchHtml(){var h='<div class="srch" style="margin-top:8px"><span onclick="goTab(\'apps\')" style="display:flex;cursor:pointer">'+ICO_BACK+'</span><input id="q" placeholder="Search apps &amp; games" value="'+esc(S.q)+'" oninput="onQ(this.value)"/></div>';
var cats=["All"],seen={};
for(var k=0;k<APPS.length;k++){if(!seen[APPS[k].c]){seen[APPS[k].c]=1;cats.push(APPS[k].c);}}
h+='<div class="chips">';
for(var c2=0;c2<cats.length;c2++){var c=cats[c2],on=(!S.scat&&c==="All")||(S.scat===c);
h+='<button class="chip'+(on?" on":"")+'" onclick="setScat(\''+c.replace(/'/g,"")+'\')">'+esc(c)+'</button>';}
h+='</div>';
if(!S.q&&!S.scat){h+='<div class="tag">RECENT SEARCHES</div>';
for(var r2=0;r2<S.recent.length;r2++){h+='<div class="rrow" onclick="qGo(\''+S.recent[r2]+'\')">'+ICO_HIST+'<span style="flex:1">'+esc(S.recent[r2])+'</span></div>';}}
h+='<div id="res">'+resultsHtml()+'</div>';return h;}
function setScat(c){S.scat=(c==="All")?null:c;save();render();centerChip();var i=document.getElementById("q");if(i){i.focus();}}
function onQ(v){S.q=v;var r=document.getElementById("res");if(r)r.innerHTML=resultsHtml();}
function qGo(q){S.q=q;S.scat=null;save();render();var i=document.getElementById("q");if(i)i.focus();}
function detailHtml(a){var h='<div class="toolbar"><button class="icobtn" onclick="goTab(\'apps\')">'+ICO_BACK+'</button><span class="tt" style="flex:1">'+esc(a.t)+'</span><button class="icobtn" onclick="goTab(\'search\')">'+ICO_SEARCH+'</button><button class="icobtn" onclick="openSheet(\''+a.id+'\')">'+ICO_MORE+'</button></div>';
h+='<div class="dhead">'+iconHtml(a,true)+'<div><h2>'+esc(a.t)+'</h2><div class="c">'+esc(a.c)+'</div><div class="d">'+esc(a.d)+'</div></div></div>';
h+='<div class="stats"><div class="stat"><b>'+esc(a.v)+'</b><span>Version</span></div><div class="stat"><b>'+esc(a.s)+'</b><span>Size</span></div><div class="stat"><b>'+esc(a.av)+'</b><span>Android</span></div><div class="stat"><b>Sep 2026</b><span>Updated</span></div></div>';
h+='<div class="dact">';
if(S.dl[a.id]){h+='<button class="biginstall"><span class="fill" data-fill="'+a.id+'"></span><span class="lb" data-lb="'+a.id+'">0%</span></button><button class="xbtn" onclick="cancelDl(\''+a.id+'\')">✕</button>';}
else if(S.inst[a.id]){h+='<button class="halfbtn out" onclick="uninstall(\''+a.id+'\')">Uninstall</button><button class="halfbtn fil" onclick="openApp(\''+a.id+'\')">Open</button>';}
else{h+='<button class="biginstall" onclick="startDl(\''+a.id+'\')"><span class="lb">Install</span></button>';}
h+='</div>';
h+='<div class="tag">SCREENSHOTS</div><div class="shots">';
var sbgs=["#1d2733","#241d33","#1d3327"];
for(var si=0;si<3;si++){h+='<div class="shot" onclick="openLb('+si+')"><i style="top:18px;height:9px"></i><i style="top:38px;height:9px;left:14px;right:60px"></i><i style="top:60px;bottom:18px;height:auto;background:'+sbgs[si]+'"></i></div>';}
h+='</div>';
h+='<div class="tag">CATEGORY</div><div class="rrow" onclick="catGo(\''+a.c.replace(/'/g,"")+'\')"><img src="'+a.i+'" style="width:38px;height:38px;border-radius:10px;background:#222"/><span style="flex:1">'+esc(a.c)+'</span><span class="chev">→</span></div>';
h+='<div class="tag">ABOUT THIS APP</div><div class="about"><b>'+esc(a.t)+'. </b>'+esc(a.ab)+'</div>';
h+='<div class="tag">RECOMMENDED FOR YOU</div><div class="hscr">';
var rel=[],oth=[];
for(var k=0;k<APPS.length;k++){if(APPS[k].id===a.id)continue;(APPS[k].c===a.c?rel:oth).push(APPS[k]);}
var list=rel.concat(oth).slice(0,8);
for(var ri=0;ri<list.length;ri++){var ra=list[ri];
h+='<div class="hcard" onclick="goDetail(\''+ra.id+'\')"><img src="'+ra.i+'"/><div class="t">'+esc(ra.t)+'</div><div class="s">'+esc(ra.c)+' · '+esc(ra.s)+'</div>'+actionHtml(ra,true)+'</div>';}
h+='</div>';return h;}
function updatesHtml(){var ids=Object.keys(S.upd),h='<div class="uhead"><h2>Updates</h2>';
if(ids.length)h+='<button class="uall" onclick="updateAll()">Update all</button>';
h+='</div>';
if(ids.length){h+='<div class="unote">'+ids.length+' update'+(ids.length>1?"s":"")+' available</div>';
for(var k=0;k<ids.length;k++){var a=byId(ids[k]);
h+='<div class="arow" onclick="goDetail(\''+a.id+'\')">'+iconHtml(a)+'<div class="ainfo"><div class="t">'+esc(a.t)+'</div><div class="s">v'+esc(S.upd[a.id])+' → v'+esc(a.v)+' · '+esc(a.s)+'</div></div>';
if(S.dl[a.id])h+=ringBtn(a.id);else h+='<button class="pill" onclick="event.stopPropagation();startDl(\''+a.id+'\')">Update</button>';
h+='</div>';}}
else{h+='<div class="empty">You\'re up to date.<br>All apps are on their latest versions.</div>';}
var done=Object.keys(S.updDone);
if(done.length){h+='<div class="tag">RECENTLY UPDATED</div>';
for(var d2=0;d2<done.length;d2++){var a2=byId(done[d2]);
h+='<div class="arow" onclick="goDetail(\''+a2.id+'\')">'+iconHtml(a2)+'<div class="ainfo"><div class="t">'+esc(a2.t)+'</div><div class="s">Updated just now · v'+esc(a2.v)+'</div></div><button class="openbtn" onclick="event.stopPropagation();openApp(\''+a2.id+'\')">Open</button></div>';}}
return h;}
function updateAll(){var ids=Object.keys(S.upd);for(var k=0;k<ids.length;k++)startDl(ids[k]);}
function libraryHtml(){var ids=Object.keys(S.inst),h='<div class="uhead"><h2>Library</h2><button class="sicobtn" style="color:#9aa0a6" onclick="goTab(\'settings\')">'+ICO_GEAR+'</button></div><div class="unote">'+ids.length+' app'+(ids.length===1?"":"s")+' installed from APK STORE</div>';
if(!ids.length)h+='<div class="empty">Nothing installed yet.<br>Install an app to see it here.</div>';
for(var k=0;k<ids.length;k++){var a=byId(ids[k]);if(!a)continue;
h+='<div class="arow" onclick="goDetail(\''+a.id+'\')">'+iconHtml(a)+'<div class="ainfo"><div class="t">'+esc(a.t)+'</div><div class="s">'+esc(a.c)+' · v'+esc(a.v)+'</div></div><button class="openbtn" onclick="event.stopPropagation();openApp(\''+a.id+'\')">Open</button><button class="openbtn" style="color:#9aa0a6" onclick="event.stopPropagation();uninstall(\''+a.id+'\')">Uninstall</button></div>';}
return h;}
var ICO_GEAR='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 8h10M18 8h2M4 16h4M12 16h8"/><circle cx="16" cy="8" r="2.2"/><circle cx="10" cy="16" r="2.2"/></svg>';
var ICO_UPD='<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-2.6-6.4M21 4v5h-5"/></svg>';
var ICO_DOC='<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2h9l5 5v15H6z"/><path d="M14 2v6h6"/></svg>';
function openSheet(id){S.sheet=id;save();render();}
function closeSheet(){S.sheet=null;save();render();}
function sheetHtml(a){var h='<div class="sheetwrap" onclick="closeSheet()"><div class="sheet" onclick="event.stopPropagation()"><div class="grab"></div><h4>App info</h4>';
var rows=[["Package",a.pkg],["Version",a.v],["Size",a.s],["Requires","Android "+a.av],["Category",a.c],["Developer",a.d]];
for(var k=0;k<rows.length;k++)h+='<div class="irow"><span class="k">'+rows[k][0]+'</span><span class="v">'+esc(rows[k][1])+'</span></div>';
h+='<div style="padding:12px 20px 4px"><button class="halfbtn out" style="width:100%" onclick="closeSheet()">Close</button></div></div></div>';return h;}
function openLb(i){S.lb=i;save();render();}
function closeLb(){S.lb=null;save();render();}
function lbNav(d){S.lb=(S.lb+d+3)%3;save();render();}
function lbHtml(){var grads=["linear-gradient(165deg,#232a38,#141920)","linear-gradient(165deg,#2b2338,#191426)","linear-gradient(165deg,#23382a,#142019)"];
return '<div class="lbwrap"><div class="lbtop"><span>'+(S.lb+1)+' / 3</span><button class="icobtn" onclick="closeLb()">✕</button></div><div class="lbmain"><button class="lbarr" onclick="lbNav(-1)">‹</button><div class="lbshot" style="background:'+grads[S.lb]+'"><i style="top:26px;height:12px"></i><i style="top:52px;height:12px;left:20px;right:110px"></i><i style="top:90px;bottom:26px;height:auto;background:#2b3546"></i></div><button class="lbarr" onclick="lbNav(1)">›</button></div><div style="height:40px"></div></div>';}
function srowHtml(t,s,fn,arg,ic){return '<div class="srow" onclick="'+fn+'(\''+arg+'\')"><span class="sic">'+ic+'</span><div class="tx" style="flex:1"><div class="t">'+t+'</div><div class="s">'+s+'</div></div><span class="chev">→</span></div>';}
function settingsHtml(){var h='<div class="toolbar"><button class="icobtn" onclick="goTab(\'apps\')">'+ICO_BACK+'</button><span class="tt">Settings</span></div>';
h+='<div class="tag">GENERAL</div>';
h+='<div class="srow" onclick="checkUpdate()"><span class="sic">'+ICO_UPD+'</span><div class="tx" style="flex:1"><div class="t">Check for updates</div><div class="s" id="updst">APK STORE 1.1.6 · tap to check</div></div><span class="chev">→</span></div>';
h+='<div class="tag">ABOUT</div>';
h+=srowHtml("Privacy Policy","How we handle your data","policy","privacy",ICO_DOC);
h+=srowHtml("Terms of Service","Rules for using APK STORE","policy","terms",ICO_DOC);
h+=srowHtml("About APK STORE","Version 1.1.6 · com.apkstore.client","policy","about",ICO_DOC);
h+='<div class="verline">APK STORE · v1.1.6 (14)</div>';
return h;}
function checkUpdate(){var el=document.getElementById("updst");if(el)el.textContent="Checking…";toast("Checking for updates…");
setTimeout(function(){var e2=document.getElementById("updst");if(e2)e2.textContent="Last checked just now · up to date";toast("You're up to date");},1400);}
function policy(k){S.tab="policy";S.pkind=k;save();render();document.getElementById("sbody").scrollTop=0;}
function policyHtml(kind){var h='<div class="toolbar"><button class="icobtn" onclick="goTab(\'settings\')">'+ICO_BACK+'</button><span class="tt">'+(kind==="privacy"?"Privacy Policy":kind==="terms"?"Terms of Service":"About APK STORE")+'</span></div><div class="ptext">';
if(kind==="privacy"){h+="<h5>Privacy Policy</h5>APK STORE does not need an account and does not track you across apps.<h5>What we collect</h5>Nothing personal. Update checks only compare the versions of apps you installed from APK STORE.<h5>Downloads</h5>APK files come from the developer's own published releases. We verify package names and signatures before listing an update.<h5>Permissions</h5>The app only asks for what it needs: storage access to save APKs, and install permission to update apps.";}
else if(kind==="terms"){h+="<h5>Terms of Service</h5>APK STORE is a catalogue of apps published by their developers and trusted open-source projects.<h5>Fair use</h5>Download apps for your own devices. Do not re-upload or redistribute APKs from this store without the developer's permission.<h5>Updates</h5>We try to list updates quickly and verify signatures, but installing any app is your choice — check the developer and the permissions first.<h5>Availability</h5>Listings can change or be removed at any time, for example if a developer asks us to.";}
else{h+="<h5>About APK STORE</h5>APK STORE is a fast, private app store for Android.<h5>Version</h5>1.1.6 (version code 14)<h5>Package</h5>com.apkstore.client<h5>Updates</h5>Use Settings → Check for updates to get the newest version of APK STORE itself.";}
h+='</div>';return h;}
function render(){var b=document.getElementById("sbody"),h="";
if(S.tab==="detail"&&S.detail)h=detailHtml(byId(S.detail));
else if(S.tab==="search")h=searchHtml();
else if(S.tab==="updates")h=updatesHtml();
else if(S.tab==="library")h=libraryHtml();
else if(S.tab==="all")h=allHtml();
else if(S.tab==="settings")h=settingsHtml();
else if(S.tab==="policy")h=policyHtml(S.pkind||"about");
else h=homeHtml();
if(S.sheet)h+=sheetHtml(byId(S.sheet));
if(S.lb!=null)h+=lbHtml();
b.innerHTML=h;
var tabs=[["apps","Apps"],["search","Search"],["updates","Updates"],["library","Library"]],n="";
for(var k=0;k<tabs.length;k++){var t=tabs[k],on=(S.tab===t[0])||((S.tab==="detail"||S.tab==="all")&&t[0]==="apps");
n+='<button class="nit'+(on?" on":"")+'" onclick="goTab(\''+t[0]+'\')"><span class="pp">'+NAV[t[0]]+'</span>'+t[1];
if(t[0]==="updates"&&updCount())n+='<span class="nbadge">'+updCount()+'</span>';
n+='</button>';}
document.getElementById("pnav").innerHTML=n;
if(S.tab==="search"){var i=document.getElementById("q");}}
render();
</script>
