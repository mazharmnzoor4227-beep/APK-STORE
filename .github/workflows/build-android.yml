name: Build APK STORE Android
on:
  push:
    branches: [feat/web-publishing, publish-icon, main, fix/full-audit-20260929]
    paths: ['apps/android/**', '.github/workflows/build-android.yml']
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      APK_STORE_SIGNER_SHA256: 4c8a4d67022c354b62db264461e0d4f9cc16f6ea3c0cbce204fb7a9f7708ac60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Unit tests and Android builds
        working-directory: apps/android
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease -PapkStoreSignerSha256="$APK_STORE_SIGNER_SHA256"
      - uses: actions/upload-artifact@v4
        with:
          name: APK-STORE-debug
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: github.ref != 'refs/heads/main'
        with:
          name: APK-STORE-release-unsigned-internal
          path: apps/android/app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Require permanent release signing secrets
        if: github.ref == 'refs/heads/main'
        env:
          KEYSTORE_B64: ${{ secrets.APK_STORE_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.APK_STORE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.APK_STORE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.APK_STORE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" && test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/apk-store-release.jks"

      - name: Build signed customer release
        if: github.ref == 'refs/heads/main'
        working-directory: apps/android
        run: |
          set -euo pipefail
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/apk-store-release.jks" \
            --ks-key-alias "${{ secrets.APK_STORE_KEY_ALIAS }}" \
            --ks-pass "pass:${{ secrets.APK_STORE_KEYSTORE_PASSWORD }}" \
            --key-pass "pass:${{ secrets.APK_STORE_KEY_PASSWORD }}" \
            --out app/build/outputs/apk/release/APK-STORE-release.apk "$RUNNER_TEMP/aligned.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/APK-STORE-release.apk
          ACTUAL_CERT=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs app/build/outputs/apk/release/APK-STORE-release.apk | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1 | tr '[:upper:]' '[:lower:]' | tr -d ': ')
          test "$ACTUAL_CERT" = "$APK_STORE_SIGNER_SHA256"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/release/APK-STORE-release.apk | grep -q "package: name='com.apkstore.client'"
          sha256sum app/build/outputs/apk/release/APK-STORE-release.apk > app/build/outputs/apk/release/APK-STORE-release.apk.sha256

      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          name: APK-STORE-signed-release
          path: |
            apps/android/app/build/outputs/apk/release/APK-STORE-release.apk
            apps/android/app/build/outputs/apk/release/APK-STORE-release.apk.sha256
