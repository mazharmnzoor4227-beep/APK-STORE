name: Build APK STORE Android

on:
  push:
    branches: [feat/web-publishing, publish-icon, main]
    paths:
      - 'apps/android/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish this signed build to the APK STORE catalog'
        type: boolean
        default: false
      release_notes:
        description: 'Release notes stored on the Supabase release row'
        type: string
        default: ''

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      APKSTORE_KEYSTORE_BASE64: ${{ secrets.APKSTORE_KEYSTORE_BASE64 }}
      APKSTORE_KEYSTORE_PASSWORD: ${{ secrets.APKSTORE_KEYSTORE_PASSWORD }}
      APKSTORE_KEY_ALIAS: ${{ secrets.APKSTORE_KEY_ALIAS }}
      APKSTORE_KEY_PASSWORD: ${{ secrets.APKSTORE_KEY_PASSWORD }}
      EXPECTED_PACKAGE: com.apkstore.client
      EXPECTED_MIN_SDK: '26'
      EXPECTED_TARGET_SDK: '35'
      EXPECTED_SIGNER_SHA256: cd5fff73675c8c783db51a3300cc06845763215d2c7b03a64ae7f9b589360585
      SUPABASE_URL: https://qfbfxencwsgryoczkdyj.supabase.co
      APP_SLUG: apk-store-client

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Test and build debug APK
        working-directory: apps/android
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: APK-STORE-debug
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Validate permanent release signing secrets
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          for name in APKSTORE_KEYSTORE_BASE64 APKSTORE_KEYSTORE_PASSWORD APKSTORE_KEY_ALIAS APKSTORE_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              exit 1
            fi
          done

      - name: Validate publish secret
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::Missing GitHub Actions secret: SUPABASE_SERVICE_ROLE_KEY"
            exit 1
          fi

      - name: Restore permanent release keystore
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/apkstore-release.jks"
          printf '%s' "$APKSTORE_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          echo "APKSTORE_KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"

      - name: Build signed release APK
        if: github.event_name == 'workflow_dispatch'
        working-directory: apps/android
        run: gradle --no-daemon :app:assembleRelease

      - name: Verify signed release identity
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          OUT="apps/android/app/build/outputs/apk/release"
          APK="$OUT/app-release.apk"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          GRADLE_FILE="apps/android/app/build.gradle"
          test -f "$APK"

          EXPECTED_VERSION_NAME="$(sed -nE "s/^[[:space:]]*versionName[[:space:]]+'([^']+)'.*/\1/p" "$GRADLE_FILE" | head -1)"
          EXPECTED_VERSION_CODE="$(sed -nE 's/^[[:space:]]*versionCode[[:space:]]+([0-9]+).*/\1/p' "$GRADLE_FILE" | head -1)"
          if [ -z "$EXPECTED_VERSION_NAME" ] || ! [[ "$EXPECTED_VERSION_CODE" =~ ^[0-9]+$ ]]; then
            echo "::error::Could not resolve versionName/versionCode from $GRADLE_FILE"
            exit 1
          fi

          BADGING="$($AAPT dump badging "$APK")"
          PACKAGE_LINE="$(printf '%s\n' "$BADGING" | grep '^package:' | head -1)"
          printf '%s\n' "$PACKAGE_LINE"
          printf '%s\n' "$PACKAGE_LINE" | grep -F "name='$EXPECTED_PACKAGE'"
          printf '%s\n' "$PACKAGE_LINE" | grep -F "versionCode='$EXPECTED_VERSION_CODE'"
          printf '%s\n' "$PACKAGE_LINE" | grep -F "versionName='$EXPECTED_VERSION_NAME'"
          printf '%s\n' "$BADGING" | grep -F "sdkVersion:'$EXPECTED_MIN_SDK'"
          printf '%s\n' "$BADGING" | grep -F "targetSdkVersion:'$EXPECTED_TARGET_SDK'"

          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$OUT/signing-certificate.txt"
          SIGNER="$($APKSIGNER verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1 | tr '[:upper:]' '[:lower:]')"
          if [ "$SIGNER" != "$EXPECTED_SIGNER_SHA256" ]; then
            echo "::error::Release signer mismatch. Refusing to publish artifact."
            exit 1
          fi

          APK_SHA256="$(sha256sum "$APK" | awk '{print $1}')"
          APK_BYTES="$(stat -c %s "$APK")"
          printf '%s  %s\n' "$APK_SHA256" "$APK" | tee "$OUT/apk-sha256.txt"
          {
            echo "package_id=$EXPECTED_PACKAGE"
            echo "version_name=$EXPECTED_VERSION_NAME"
            echo "version_code=$EXPECTED_VERSION_CODE"
            echo "min_sdk=$EXPECTED_MIN_SDK"
            echo "target_sdk=$EXPECTED_TARGET_SDK"
            echo "certificate_sha256=$SIGNER"
            echo "apk_sha256=$APK_SHA256"
            echo "byte_size=$APK_BYTES"
          } | tee "$OUT/release-identity.txt"

          cp "$APK" "$OUT/APK-STORE-signed.apk"

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: APK-STORE-signed-release
          path: |
            apps/android/app/build/outputs/apk/release/APK-STORE-signed.apk
            apps/android/app/build/outputs/apk/release/signing-certificate.txt
            apps/android/app/build/outputs/apk/release/apk-sha256.txt
            apps/android/app/build/outputs/apk/release/release-identity.txt

      - name: Publish release to Supabase
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone

          base = os.environ["SUPABASE_URL"].rstrip("/")
          key = os.environ.get("SUPABASE_SERVICE_ROLE_KEY", "")
          slug = os.environ["APP_SLUG"]
          if not key:
              sys.exit("::error::SUPABASE_SERVICE_ROLE_KEY is empty")

          release_dir = "apps/android/app/build/outputs/apk/release"
          apk_path = release_dir + "/APK-STORE-signed.apk"
          identity_path = release_dir + "/release-identity.txt"

          meta = {}
          with open(identity_path, encoding="utf-8") as fh:
              for raw_line in fh:
                  line = raw_line.strip()
                  if line and "=" in line:
                      k, v = line.split("=", 1)
                      meta[k.strip()] = v.strip()

          required = {
              "package_id", "version_name", "version_code", "min_sdk", "target_sdk",
              "certificate_sha256", "apk_sha256", "byte_size"
          }
          missing = sorted(required - meta.keys())
          if missing:
              sys.exit("::error::release-identity.txt is missing: " + ", ".join(missing))

          version_code = int(meta["version_code"])
          expected_size = int(meta["byte_size"])
          with open(apk_path, "rb") as fh:
              apk_bytes = fh.read()
          actual_sha256 = hashlib.sha256(apk_bytes).hexdigest()
          if len(apk_bytes) != expected_size:
              sys.exit("::error::APK byte size changed after verification")
          if actual_sha256 != meta["apk_sha256"]:
              sys.exit("::error::APK SHA-256 changed after verification")

          storage_key = f"{slug}/{version_code}-{actual_sha256[:16]}.apk"

          def req(method, path, body=None, content_type="application/json", extra=None):
              headers = {"apikey": key, "Authorization": "Bearer " + key}
              if extra:
                  headers.update(extra)
              if body is None:
                  data = None
              elif isinstance(body, (dict, list)):
                  data = json.dumps(body).encode()
                  headers["Content-Type"] = content_type
              else:
                  data = body
                  headers["Content-Type"] = content_type
              request = urllib.request.Request(base + path, data=data, method=method, headers=headers)
              try:
                  with urllib.request.urlopen(request, timeout=180) as response:
                      return response.status, response.read()
              except urllib.error.HTTPError as error:
                  return error.code, error.read()

          quoted_slug = urllib.parse.quote(slug, safe="")
          status, raw = req("GET", f"/rest/v1/apps?slug=eq.{quoted_slug}&select=id,package_id")
          rows = json.loads(raw or b"[]")
          if status != 200 or len(rows) != 1:
              sys.exit(f"::error::apps row '{slug}' not found uniquely (HTTP {status}): {raw[:300]!r}")
          app_id = rows[0]["id"]
          if rows[0]["package_id"] != meta["package_id"]:
              sys.exit("::error::Catalog package_id does not match signed APK")

          quoted_storage_key = urllib.parse.quote(storage_key, safe="/")
          status, raw = req(
              "POST",
              "/storage/v1/object/apk-files/" + quoted_storage_key,
              body=apk_bytes,
              content_type="application/vnd.android.package-archive",
              extra={"x-upsert": "true"},
          )
          if status not in (200, 201):
              sys.exit(f"::error::storage upload failed (HTTP {status}): {raw[:500]!r}")
          print(f"uploaded {storage_key} ({len(apk_bytes)} bytes)")

          status, raw = req(
              "GET",
              "/rest/v1/releases?app_id=eq.%s&version_code=eq.%d&select=id,version_name,version_code,certificate_sha256,apk_sha256,byte_size,storage_key,status"
              % (app_id, version_code),
          )
          existing = json.loads(raw or b"[]")
          if status != 200:
              sys.exit(f"::error::existing-release lookup failed (HTTP {status}): {raw[:500]!r}")

          if existing:
              if len(existing) != 1:
                  sys.exit("::error::More than one release row exists for this app/versionCode")
              row = existing[0]
              expected = {
                  "version_name": meta["version_name"],
                  "version_code": version_code,
                  "certificate_sha256": meta["certificate_sha256"],
                  "apk_sha256": meta["apk_sha256"],
                  "byte_size": expected_size,
                  "storage_key": storage_key,
                  "status": "published",
              }
              mismatches = [k for k, v in expected.items() if row.get(k) != v]
              if mismatches:
                  sys.exit("::error::Existing release row conflicts with this signed APK: " + ", ".join(mismatches))
              release_id = row["id"]
              print("release row already exists and matches:", release_id)
          else:
              release = {
                  "app_id": app_id,
                  "package_id": meta["package_id"],
                  "version_code": version_code,
                  "version_name": meta["version_name"],
                  "certificate_sha256": meta["certificate_sha256"],
                  "apk_sha256": meta["apk_sha256"],
                  "byte_size": expected_size,
                  "storage_key": storage_key,
                  "release_notes": os.environ.get("RELEASE_NOTES", ""),
                  "source": "github",
                  "status": "published",
                  "published_at": datetime.now(timezone.utc).isoformat(),
              }
              status, raw = req("POST", "/rest/v1/releases", body=release, extra={"Prefer": "return=representation"})
              if status not in (200, 201):
                  sys.exit(f"::error::release insert failed (HTTP {status}): {raw[:500]!r}")
              created = json.loads(raw or b"[]")
              if len(created) != 1:
                  sys.exit("::error::release insert did not return exactly one row")
              release_id = created[0]["id"]
              print("created release row:", release_id)

          status, raw = req("PATCH", "/rest/v1/apps?id=eq." + app_id, body={"current_release_id": release_id})
          if status not in (200, 204):
              sys.exit(f"::error::current_release_id update failed (HTTP {status}): {raw[:500]!r}")

          status, raw = req("GET", "/rest/v1/apps?id=eq.%s&select=current_release_id" % app_id)
          app_rows = json.loads(raw or b"[]")
          if status != 200 or len(app_rows) != 1 or app_rows[0].get("current_release_id") != release_id:
              sys.exit(f"::error::current_release_id read-back mismatch (HTTP {status}): {raw[:500]!r}")

          status, raw = req(
              "GET",
              "/rest/v1/releases?id=eq.%s&select=id,version_name,version_code,certificate_sha256,apk_sha256,byte_size,storage_key,status"
              % release_id,
          )
          release_rows = json.loads(raw or b"[]")
          if status != 200 or len(release_rows) != 1:
              sys.exit(f"::error::release read-back failed (HTTP {status}): {raw[:500]!r}")
          row = release_rows[0]
          expected = {
              "id": release_id,
              "version_name": meta["version_name"],
              "version_code": version_code,
              "certificate_sha256": meta["certificate_sha256"],
              "apk_sha256": meta["apk_sha256"],
              "byte_size": expected_size,
              "storage_key": storage_key,
              "status": "published",
          }
          mismatches = [k for k, v in expected.items() if row.get(k) != v]
          if mismatches:
              sys.exit("::error::Published release read-back mismatch: " + ", ".join(mismatches))
          print("publish read-back verified:", json.dumps(row, sort_keys=True))
          print("PUBLISH_OK", release_id)
          PY

      - name: Verify public download endpoint
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_DIR="apps/android/app/build/outputs/apk/release"
          IDENTITY="$RELEASE_DIR/release-identity.txt"
          PUBLIC_APK="$RUNNER_TEMP/apk-store-public.apk"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"

          expected_sha="$(sed -n 's/^apk_sha256=//p' "$IDENTITY")"
          expected_size="$(sed -n 's/^byte_size=//p' "$IDENTITY")"
          expected_version_name="$(sed -n 's/^version_name=//p' "$IDENTITY")"
          expected_version_code="$(sed -n 's/^version_code=//p' "$IDENTITY")"

          curl --fail --location --retry 5 --retry-all-errors --retry-delay 2 \
            --connect-timeout 20 --max-time 600 \
            "$SUPABASE_URL/functions/v1/download-apk?slug=$APP_SLUG" \
            --output "$PUBLIC_APK"

          actual_sha="$(sha256sum "$PUBLIC_APK" | awk '{print $1}')"
          actual_size="$(stat -c %s "$PUBLIC_APK")"
          test "$actual_sha" = "$expected_sha"
          test "$actual_size" = "$expected_size"

          BADGING="$($AAPT dump badging "$PUBLIC_APK")"
          PACKAGE_LINE="$(printf '%s\n' "$BADGING" | grep '^package:' | head -1)"
          printf '%s\n' "$PACKAGE_LINE" | grep -F "name='$EXPECTED_PACKAGE'"
          printf '%s\n' "$PACKAGE_LINE" | grep -F "versionCode='$expected_version_code'"
          printf '%s\n' "$PACKAGE_LINE" | grep -F "versionName='$expected_version_name'"
          printf '%s\n' "$BADGING" | grep -F "sdkVersion:'$EXPECTED_MIN_SDK'"
          printf '%s\n' "$BADGING" | grep -F "targetSdkVersion:'$EXPECTED_TARGET_SDK'"

          "$APKSIGNER" verify --verbose --print-certs "$PUBLIC_APK"
          signer="$($APKSIGNER verify --print-certs "$PUBLIC_APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1 | tr '[:upper:]' '[:lower:]')"
          test "$signer" = "$EXPECTED_SIGNER_SHA256"

          echo "PUBLIC_VERIFY_OK version=$expected_version_name code=$expected_version_code sha256=$actual_sha bytes=$actual_size"
