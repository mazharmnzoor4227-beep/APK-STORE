name: Apply self-update verifier wiring
on:
  push:
    branches: [fix/full-audit-20260929]
    paths: ['.github/workflows/apply-self-update-verifier-wiring.yml']
permissions:
  contents: write
# Diagnostic rerun: keep until verifier wiring and Android suite are green, then remove before merge.
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/full-audit-20260929
      - name: Wire APK STORE verification into install flow
        shell: python
        run: |
          from pathlib import Path
          p = Path('apps/android/app/src/main/java/com/apkstore/client/MainActivity.java')
          s = p.read_text()
          old = '''                ApkIntegrity.verifyFile(apk, release.optString("apk_sha256"), release.optLong("byte_size"));
                          ApkIntegrity.verifyPackage(this, apk, target.optString("package_id"), release.optString("certificate_sha256"));
                          InstallCoordinator.install(this, apk, slug, target.optString("package_id"));'''
          if old not in s:
              raise SystemExit('install verification block not found')
          new = '''                ApkIntegrity.verifyFile(apk, release.optString("apk_sha256"), release.optLong("byte_size"));
                ApkIntegrity.verifyPackage(this, apk, target.optString("package_id"), release.optString("certificate_sha256"));
                if (StoreIdentity.CATALOG_SLUG.equals(slug)
                        || StoreIdentity.PACKAGE_ID.equals(target.optString("package_id"))) {
                    ApkUpdateVerifier.Result selfCheck = ApkUpdateVerifier.verify(
                            this, apk, release.optString("apk_sha256"), release.optLong("byte_size"));
                    if (!selfCheck.ok) {
                        if (!apk.delete() && apk.exists()) apk.deleteOnExit();
                        throw new SecurityException(selfCheck.reason);
                    }
                }
                InstallCoordinator.install(this, apk, slug, target.optString("package_id"));'''
          p.write_text(s.replace(old, new, 1))
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Diagnose Android unit tests
        working-directory: apps/android
        run: gradle --no-daemon :app:testDebugUnitTest --info --stacktrace
      - name: Verify debug build
        working-directory: apps/android
        run: gradle --no-daemon :app:assembleDebug
      - name: Commit wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/android/app/src/main/java/com/apkstore/client/MainActivity.java
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: wire apk store update verifier"
          git push origin HEAD:fix/full-audit-20260929
