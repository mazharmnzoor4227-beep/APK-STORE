name: Apply self-update verifier wiring
on:
  push:
    branches:
      - fix/full-audit-20260929
    paths:
      - .github/workflows/apply-self-update-verifier-wiring.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/full-audit-20260929
          fetch-depth: 0
      - name: Apply self-update patch
        run: python3 .github/scripts/apply-self-update.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Verify Android tests and builds
        working-directory: apps/android
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease
      - name: Commit verified wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/android/app/src/main/java/com/apkstore/client/MainActivity.java
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: complete verified apk store self update flow"
          git fetch origin fix/full-audit-20260929
          git rebase origin/fix/full-audit-20260929
          git push origin HEAD:fix/full-audit-20260929
