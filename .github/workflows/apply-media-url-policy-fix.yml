name: Apply catalog media URL fix

on:
  push:
    branches: [fix/full-audit-20260929]
    paths:
      - '.github/workflows/apply-media-url-policy-fix.yml'

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/full-audit-20260929
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Apply minimal implementation
        shell: bash
        run: |
          cat > apps/android/app/src/main/java/com/apkstore/client/MediaUrlPolicy.java <<'JAVA'
          package com.apkstore.client;

          import java.net.URI;
          import java.util.Locale;

          final class MediaUrlPolicy {
              private MediaUrlPolicy() {}

              static boolean trusted(String raw, String supabaseBase) {
                  if (raw == null || raw.isEmpty()) return false;
                  try {
                      URI uri = URI.create(raw);
                      if (!"https".equalsIgnoreCase(uri.getScheme()) || uri.getUserInfo() != null || uri.getFragment() != null) return false;
                      String host = uri.getHost();
                      String path = uri.getPath();
                      if (host == null || path == null) return false;

                      if (raw.startsWith(supabaseBase + "/storage/v1/object/public/app-screenshots/") ||
                              raw.startsWith(supabaseBase + "/storage/v1/object/public/app-icons/")) return true;

                      String lowerPath = path.toLowerCase(Locale.ROOT);
                      boolean image = lowerPath.endsWith(".png") || lowerPath.endsWith(".webp") ||
                              lowerPath.endsWith(".jpg") || lowerPath.endsWith(".jpeg");
                      if (!image) return false;

                      if ("f-droid.org".equalsIgnoreCase(host)) {
                          return path.matches("^/repo/[A-Za-z0-9._-]+/en-US/phoneScreenshots/[A-Za-z0-9._%=-]+\\.(?i:png|webp|jpe?g)$");
                      }
                      if ("raw.githubusercontent.com".equalsIgnoreCase(host)) {
                          return path.matches("^/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+/[^/]+/.+\\.(?i:png|webp|jpe?g)$");
                      }
                      return "apk-store-mazhar.mazharmanzoor4117.chatgpt.site".equalsIgnoreCase(host) && image;
                  } catch (IllegalArgumentException error) {
                      return false;
                  }
              }
          }
          JAVA

          python3 - <<'PY'
          from pathlib import Path
          path = Path('apps/android/app/src/main/java/com/apkstore/client/MainActivity.java')
          text = path.read_text()
          old = '''    private boolean trustedImage(String url) {\n        return url.startsWith(BuildConfig.SUPABASE_URL + "/storage/v1/object/public/app-screenshots/") ||\n                url.startsWith(BuildConfig.SUPABASE_URL + "/storage/v1/object/public/app-icons/") ||\n                (url.startsWith("https://apk-store-mazhar.mazharmanzoor4117.chatgpt.site/") && url.endsWith(".png"));\n    }\n'''
          new = '''    private boolean trustedImage(String url) {\n        return MediaUrlPolicy.trusted(url, BuildConfig.SUPABASE_URL);\n    }\n'''
          if text.count(old) != 1:
              raise SystemExit(f'Expected one trustedImage implementation, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Verify tests and APK builds
        working-directory: apps/android
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease

      - name: Commit verified implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/android/app/src/main/java/com/apkstore/client/MediaUrlPolicy.java \
                  apps/android/app/src/main/java/com/apkstore/client/MainActivity.java
          git diff --cached --check
          git commit -m "Fix trusted screenshot sources in Android detail"
          git push origin HEAD:fix/full-audit-20260929
