name: Restore 700 MB upload limit after v15 fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-upload-limit-700-v15.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Restore 700 MB limit and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          files = {
              Path('supabase/functions/admin-upload/index.ts'): [
                  ('const maxApkSize = 500 * 1024 * 1024;', 'const maxApkSize = 700 * 1024 * 1024;'),
                  ('Select an APK up to 500 MB', 'Select an APK up to 700 MB'),
              ],
              Path('admin/index.html'): [
                  ('Up to 500 MB · .apk only', 'Up to 700 MB · .apk only'),
              ],
          }
          for path, replacements in files.items():
              text = path.read_text()
              for old, new in replacements:
                  if old not in text:
                      raise SystemExit(f'expected text not found in {path}: {old}')
                  text = text.replace(old, new)
              path.write_text(text)
          PY
          git rm .github/workflows/fix-upload-limit-700-v15.yml
          grep -F 'const maxApkSize = 700 * 1024 * 1024;' supabase/functions/admin-upload/index.ts
          grep -F 'Select an APK up to 700 MB' supabase/functions/admin-upload/index.ts
          grep -F 'Up to 700 MB · .apk only' admin/index.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/functions/admin-upload/index.ts admin/index.html
          git commit -m 'Preserve 700 MB limit with large-file hash fix'
          git push origin HEAD:main
