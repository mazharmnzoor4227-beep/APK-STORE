name: Apply handled diagnostics wiring
on:
  push:
    branches: [fix/full-audit-20260929]
    paths:
      - '.github/workflows/apply-handled-diagnostics.yml'
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/full-audit-20260929
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Apply patch
        run: python .github/scripts/apply-handled-diagnostics.py
      - name: Verify Android
        working-directory: apps/android
        env:
          APK_STORE_SIGNER_SHA256: 4c8a4d67022c354b62db264461e0d4f9cc16f6ea3c0cbce204fb7a9f7708ac60
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease -PapkStoreSignerSha256="$APK_STORE_SIGNER_SHA256"
      - name: Commit verified patch
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/android/app/src/main/java/com/apkstore/client/MainActivity.java
          git diff --cached --quiet && exit 0
          git commit -m "feat: report non-fatal download and install errors"
          git pull --rebase origin fix/full-audit-20260929
          git push origin HEAD:fix/full-audit-20260929
