name: Dispatch APK STORE v1.1.10 publish

on:
  push:
    branches: [release/v1.1.10]
    paths:
      - '.github/workflows/dispatch-publish-v1110.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch verified publish build from main
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' '{"ref":"main","inputs":{"publish":"true","release_notes":"APK STORE v1.1.10 — self-update release; versionCode 18."}}' \
            | gh api --method POST "repos/$REPO/actions/workflows/build-android.yml/dispatches" --input -
          echo "PUBLISH_DISPATCH_OK"
