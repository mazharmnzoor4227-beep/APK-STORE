name: APK STORE stability branch CI

on:
  push:
    branches:
      - fix/stability-crash-reporting-v117
    paths:
      - 'apps/android/**'
      - 'supabase/functions/crash-report/**'
      - '.github/workflows/stability-ci-temp.yml'

jobs:
  android-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Android tests and debug build
        working-directory: apps/android
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug

  crash-function-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Crash payload tests
        run: node --test supabase/functions/crash-report/crash-payload.test.mjs
