name: Verify live APK STORE v1.1.8 download
on:
  push:
    branches: [ops/dispatch-apk-store-1.1.6]
    paths: ['.github/workflows/verify-live-v118-temp.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Download live APK and verify exact release
        run: |
          set -euo pipefail
          URL='https://qfbfxencwsgryoczkdyj.supabase.co/functions/v1/download-apk?slug=apk-store-client'
          curl --fail-with-body --show-error --silent --location -D headers.txt -o live.apk "$URL"
          grep -i '^content-type: application/vnd.android.package-archive' headers.txt
          test "$(stat -c %s live.apk)" = '670874'
          echo 'd829907a765b773ea9a7dc9123b5f0a2d6fac74a3e470997ea9933a955092b8b  live.apk' | sha256sum -c -
          echo 'LIVE_V118_OK'
