name: Publish APK STORE v1.1.8 artifact to Supabase
on:
  push:
    branches: [ops/dispatch-apk-store-1.1.6]
    paths: ['.github/workflows/publish-apk-store-v118-temp.yml']
permissions:
  actions: read
  contents: read
jobs:
  upload:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_SHA256: d829907a765b773ea9a7dc9123b5f0a2d6fac74a3e470997ea9933a955092b8b
      EXPECTED_SIZE: '670874'
    steps:
      - name: Download already-verified signed artifact
        run: |
          set -euo pipefail
          mkdir -p release
          gh run download 36634115996 --repo "$GITHUB_REPOSITORY" --name APK-STORE-signed-release --dir release
          test -f release/APK-STORE-signed.apk
          echo "$EXPECTED_SHA256  release/APK-STORE-signed.apk" | sha256sum -c -
          test "$(stat -c %s release/APK-STORE-signed.apk)" = "$EXPECTED_SIZE"
      - name: Upload exact verified APK to locked Supabase release path
        run: |
          set -euo pipefail
          curl --fail-with-body --show-error --silent \
            -X POST \
            -H 'content-type: application/vnd.android.package-archive' \
            --data-binary @release/APK-STORE-signed.apk \
            'https://qfbfxencwsgryoczkdyj.supabase.co/functions/v1/release-ingest-once'
          echo
