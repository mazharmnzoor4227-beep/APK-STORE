name: Apply v1.1.9 stall fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v119-stall-fix.yml'
      - '.github/ops/v119-stall-fix.patch'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Apply patch
        shell: bash
        run: |
          set -euo pipefail
          git apply --check .github/ops/v119-stall-fix.patch
          git apply .github/ops/v119-stall-fix.patch

      - name: Test and build
        working-directory: apps/android
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Commit verified fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "apk-store-bot"
          git config user.email "actions@users.noreply.github.com"
          git add apps/android/app/build.gradle apps/android/app/src/main/java/com/apkstore/client/MainActivity.java .github/workflows/build-android.yml
          git diff --cached --check
          git commit -m "fix: recover stalled downloads and release v1.1.9"
          git push origin HEAD:main
