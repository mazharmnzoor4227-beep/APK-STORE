name: Dispatch APK STORE v1.1.7 stability build (temporary)

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/dispatch-stability-release-temp.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch official signed build on stability branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/build-android.yml/dispatches" \
            -f ref='fix/stability-crash-reporting-v117'
