name: Verify production crash ingest
on:
  push:
    branches: [fix/full-audit-20260929]
    paths: ['.github/workflows/verify-crash-endpoint.yml']
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: POST controlled crash report
        run: |
          set -euo pipefail
          NOW=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          BODY=$(cat <<EOF
          {"fingerprint":"9056c11cd781a4aa66511346c4d6addd04589d1fe668f2ca7b683eebdd7e0c8f","package_id":"com.apkstore.client","version_code":13,"version_name":"1.1.5-verification","android_sdk":36,"device_manufacturer":"CI","device_model":"GitHub Actions","exception_class":"com.apkstore.verification.IntentionalCrash","message":"Controlled crash-ingest verification","stack_trace":"com.apkstore.verification.IntentionalCrash: controlled verification","occurred_at":"$NOW"}
          EOF
          )
          STATUS=$(curl --silent --show-error --output response.json --write-out '%{http_code}' \
            --request POST \
            --header 'content-type: application/json' \
            --data "$BODY" \
            'https://qfbfxencwsgryoczkdyj.supabase.co/functions/v1/report-crash')
          cat response.json
          test "$STATUS" = '202'
          grep -q '"accepted":true' response.json
