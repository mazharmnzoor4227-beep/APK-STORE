name: Apply audited icon fixes

on:
  push:
    branches: [fix/audit-icons-20260929]
    paths:
      - '.github/workflows/apply-audit-icon-fix.yml'
      - 'apps/android/app/src/test/java/com/apkstore/client/IconLoadingPolicyTest.java'

permissions:
  contents: write

jobs:
  patch-test-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/audit-icons-20260929

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: RED - prove the icon regressions exist
        working-directory: apps/android
        shell: bash
        run: |
          set +e
          gradle --no-daemon :app:testDebugUnitTest --tests com.apkstore.client.IconLoadingPolicyTest
          status=$?
          set -e
          result="app/build/test-results/testDebugUnitTest/TEST-com.apkstore.client.IconLoadingPolicyTest.xml"
          test "$status" -ne 0
          test -f "$result"
          grep -q '<failure' "$result"
          grep -q 'catalogIconLoaderAcceptsHttpsIconUrls\|launcherHasLegacyDensityResources\|adaptiveLauncherUsesSuppliedStoreArtwork' "$result"
          echo "Expected regression reproduced before the fix."

      - name: Apply minimal root-cause fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          main = Path('apps/android/app/src/main/java/com/apkstore/client/MainActivity.java')
          text = main.read_text()
          old = '\n'.join([
              '        boolean hostedIcon = url.startsWith("https://apk-store-mazhar.mazharmanzoor4117.chatgpt.site/") && url.endsWith(".png");',
              '        boolean storageIcon = url.startsWith(BuildConfig.SUPABASE_URL + "/storage/v1/object/public/app-icons/");',
              '        if (!hostedIcon && !storageIcon) return fallback;'
          ])
          new = '\n'.join([
              '        // icon_url is owner-controlled catalog data and may live on Supabase Storage,',
              '        // the app-icon Edge Function, R2, F-Droid or GitHub. Require TLS, then rely on',
              '        // the byte limit + Bitmap decode below instead of hard-coding an obsolete host.',
              '        if (!url.startsWith("https://")) return fallback;'
          ])
          if old not in text:
              raise SystemExit('Expected old icon host gate was not found; refusing to guess.')
          main.write_text(text.replace(old, new, 1))

          gradle = Path('apps/android/app/build.gradle')
          g = gradle.read_text()
          if "versionCode 12" not in g or "versionName '1.1.4'" not in g:
              raise SystemExit('Expected Android version markers were not found.')
          g = g.replace('versionCode 12', 'versionCode 13', 1).replace("versionName '1.1.4'", "versionName '1.1.5'", 1)
          gradle.write_text(g)

          adaptive = Path('apps/android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml')
          a = adaptive.read_text()
          if '@drawable/icon_foreground' not in a:
              raise SystemExit('Expected adaptive icon foreground reference was not found.')
          adaptive.write_text(a.replace('@drawable/icon_foreground', '@drawable/apk_store_foreground', 1))
          PY

          python3 -m pip install --disable-pip-version-check --quiet pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image

          res = Path('apps/android/app/src/main/res')
          source = res / 'drawable-nodpi' / 'store_icon.jpg'
          if not source.is_file():
              raise SystemExit('Supplied APK STORE artwork is missing: ' + str(source))
          image = Image.open(source).convert('RGBA')

          for density, size in [('mdpi',48), ('hdpi',72), ('xhdpi',96), ('xxhdpi',144), ('xxxhdpi',192)]:
              folder = res / ('mipmap-' + density)
              folder.mkdir(parents=True, exist_ok=True)
              image.resize((size, size), Image.Resampling.LANCZOS).save(folder / 'ic_launcher.png', 'PNG', optimize=True)

          canvas = Image.new('RGBA', (432, 432), (0, 0, 0, 0))
          art = image.resize((336, 336), Image.Resampling.LANCZOS)
          canvas.alpha_composite(art, (48, 48))
          canvas.save(res / 'drawable-nodpi' / 'apk_store_foreground.png', 'PNG', optimize=True)
          PY

      - name: GREEN - run Android unit tests and builds
        working-directory: apps/android
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease

      - name: Commit verified fixes to the branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/android
          git diff --cached --check
          git commit -m "Fix catalog and launcher icons in Android 1.1.5"
          git push origin HEAD:fix/audit-icons-20260929

      - uses: actions/upload-artifact@v4
        with:
          name: APK-STORE-1.1.5-debug
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
