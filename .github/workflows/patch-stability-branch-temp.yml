name: Patch APK STORE stability branch (temporary)

on:
  push:
    branches: [main]
    paths: ['.github/workflows/patch-stability-branch-temp.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/stability-crash-reporting-v117
          fetch-depth: 0
      - name: Apply focused MainActivity stability patch
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('apps/android/app/src/main/java/com/apkstore/client/MainActivity.java')
          text = p.read_text()
          text = text.replace('        setupCrashReporting();\n', '')
          text = text.replace('import androidx.work.Configuration;\n', '')
          start_marker = '    /** Catches uncaught crashes and reports them to the crash-report Edge Function. Never crashes the app itself. */\n'
          end_marker = '    @Override protected void onResume() {'
          if start_marker not in text or end_marker not in text:
              raise SystemExit('Expected crash-report block not found')
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          replacement = '''    private void scheduleUpdates() {
              // WorkManager availability must never crash the foreground app.
              try {
                  if (!CrashReporter.ensureWorkManager(this)) return;
                  int hours = WorkPolicy.normalizeUpdateHours(settingsStore.updateHours());
                  PeriodicWorkRequest request = new PeriodicWorkRequest.Builder(UpdateCheckWorker.class, hours, TimeUnit.HOURS).build();
                  WorkManager.getInstance(this).enqueueUniquePeriodicWork("catalog-update-check", ExistingPeriodicWorkPolicy.UPDATE, request);
              } catch (Throwable ignored) { }
          }
'''
          text = text[:start] + replacement + text[end:]
          p.write_text(text)
          PY
          git diff --check
      - name: Commit and push target branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/android/app/src/main/java/com/apkstore/client/MainActivity.java
          git commit -m "fix: centralize crash capture and harden update scheduling"
          git push origin HEAD:fix/stability-crash-reporting-v117
