name: Dispatch APK STORE release build (temporary)

on:
  push:
    branches:
      - ops/dispatch-apk-store-1.1.6
    paths:
      - '.github/workflows/dispatch-apk-store-release-temp.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch official Android workflow on release branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Retry after updating the stale launcher icon test for minSdk 26 adaptive icons.
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/build-android.yml/dispatches" \
            -f ref='fix/crash-workmanager-coroutines'
