name: Raise APK upload limit to 700 MB

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/raise-upload-limit-700.yml'

permissions:
  contents: write

jobs:
  update-limit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Update admin and server limits
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              Path('admin/index.html'): [
                  ('Up to 500 MB · .apk only', 'Up to 700 MB · .apk only'),
              ],
              Path('supabase/functions/admin-upload/index.ts'): [
                  ('const maxApkSize = 500 * 1024 * 1024;', 'const maxApkSize = 700 * 1024 * 1024;'),
                  ("Select an APK up to 500 MB", "Select an APK up to 700 MB"),
              ],
          }

          for path, pairs in replacements.items():
              text = path.read_text(encoding='utf-8')
              for old, new in pairs:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f'Expected exactly one match in {path}: {old!r}; found {count}')
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
          PY

          grep -F 'Up to 700 MB · .apk only' admin/index.html
          grep -F 'const maxApkSize = 700 * 1024 * 1024;' supabase/functions/admin-upload/index.ts
          grep -F 'Select an APK up to 700 MB' supabase/functions/admin-upload/index.ts

      - name: Commit update and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'APK STORE automation'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/raise-upload-limit-700.yml
          git add admin/index.html supabase/functions/admin-upload/index.ts
          git commit -m 'Raise APK upload limit from 500 MB to 700 MB'
          git push origin HEAD:main
