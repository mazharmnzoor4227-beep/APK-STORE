name: Apply Android version label fix

on:
  push:
    branches: [fix/full-audit-20260929]
    paths:
      - '.github/workflows/apply-android-version-label-fix.yml'

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/full-audit-20260929
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Apply minimal implementation
        shell: bash
        run: |
          cat > apps/android/app/src/main/java/com/apkstore/client/AndroidVersionLabel.java <<'JAVA'
          package com.apkstore.client;

          final class AndroidVersionLabel {
              private AndroidVersionLabel() {}

              static String forMinSdk(int api) {
                  if (api <= 0) return "";
                  return switch (api) {
                      case 1 -> "Android 1.0+";
                      case 2 -> "Android 1.1+";
                      case 3 -> "Android 1.5+";
                      case 4 -> "Android 1.6+";
                      case 5 -> "Android 2.0+";
                      case 6 -> "Android 2.0.1+";
                      case 7 -> "Android 2.1+";
                      case 8 -> "Android 2.2+";
                      case 9, 10 -> "Android 2.3+";
                      case 11, 12, 13 -> "Android 3.x+";
                      case 14, 15 -> "Android 4.0+";
                      case 16 -> "Android 4.1+";
                      case 17 -> "Android 4.2+";
                      case 18 -> "Android 4.3+";
                      case 19, 20 -> "Android 4.4+";
                      case 21 -> "Android 5.0+";
                      case 22 -> "Android 5.1+";
                      case 23 -> "Android 6.0+";
                      case 24 -> "Android 7.0+";
                      case 25 -> "Android 7.1+";
                      case 26 -> "Android 8.0+";
                      case 27 -> "Android 8.1+";
                      case 28 -> "Android 9+";
                      case 29 -> "Android 10+";
                      case 30 -> "Android 11+";
                      case 31 -> "Android 12+";
                      case 32 -> "Android 12L+";
                      case 33 -> "Android 13+";
                      case 34 -> "Android 14+";
                      case 35 -> "Android 15+";
                      case 36 -> "Android 16+";
                      default -> "API " + api + "+";
                  };
              }
          }
          JAVA

          python3 - <<'PY'
          from pathlib import Path
          path = Path('apps/android/app/src/main/java/com/apkstore/client/MainActivity.java')
          text = path.read_text()
          old = '        if (minSdk > 0) detailChip(chipRow, "Android " + minSdk + "+");\n'
          new = '        if (minSdk > 0) detailChip(chipRow, AndroidVersionLabel.forMinSdk(minSdk));\n'
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one raw Android SDK chip, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Verify tests and APK builds
        working-directory: apps/android
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease

      - name: Commit verified implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/android/app/src/main/java/com/apkstore/client/AndroidVersionLabel.java \
                  apps/android/app/src/main/java/com/apkstore/client/MainActivity.java
          git diff --cached --check
          git commit -m "Fix Android version labels in app details"
          git push origin HEAD:fix/full-audit-20260929
