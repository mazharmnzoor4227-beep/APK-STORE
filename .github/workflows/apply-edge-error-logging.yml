name: Apply Edge error logging
on:
  push:
    branches: [fix/full-audit-20260929]
    paths:
      - '.github/workflows/apply-edge-error-logging.yml'
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/full-audit-20260929
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply patch
        run: python .github/scripts/apply-edge-error-logging.py
      - name: Verify helpers
        run: node --test supabase/functions/**/*.test.mjs
      - name: Commit verified patch
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add supabase/functions/admin-upload/index.ts
          git diff --cached --quiet && exit 0
          git commit -m "feat: log admin Edge Function failures"
          git pull --rebase origin fix/full-audit-20260929
          git push origin HEAD:fix/full-audit-20260929
