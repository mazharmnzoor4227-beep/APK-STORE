name: Dispatch APK STORE v1.1.10 verify

on:
  push:
    branches: [release/v1.1.10]
    paths:
      - '.github/workflows/dispatch-release-v1110.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch signed verification build
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' '{"ref":"release/v1.1.10","inputs":{"publish":"false","release_notes":"APK STORE v1.1.10 self-update release verification"}}' \
            | gh api --method POST "repos/$REPO/actions/workflows/build-android.yml/dispatches" --input -
          echo "DISPATCH_OK"
