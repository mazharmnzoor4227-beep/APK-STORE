name: Patch APK STORE self-update v1.1.8
on:
  push:
    branches: [fix/self-update-flow-v118]
    paths: ['.github/workflows/patch-self-update-v118-temp.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/self-update-flow-v118
      - name: Apply focused self-update retry fix
        run: python3 .github/scripts/patch_self_update_retry.py
      - name: Commit and push
        run: |
          git config user.name "apk-store-bot"
          git config user.email "actions@users.noreply.github.com"
          git add apps/android/app/src/main/java/com/apkstore/client/MainActivity.java
          git diff --cached --check
          git commit -m "fix: make cancelled self-updates retryable"
          git push origin HEAD:fix/self-update-flow-v118
