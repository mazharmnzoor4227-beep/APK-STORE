plugins { id 'com.android.application' }

android {
    namespace 'com.apkstore.client'
    compileSdk 35
    defaultConfig {
        applicationId 'com.apkstore.client'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '1.0.1'
        buildConfigField 'String', 'SUPABASE_URL', '"https://qfbfxencwsgryoczkdyj.supabase.co"'
        // Publishable keys are public client credentials; RLS controls catalog access.
        buildConfigField 'String', 'SUPABASE_KEY', '"' + (project.findProperty('supabasePublishableKey') ?: 'sb_publishable_RiOpxFwFfj3dRt45AVn3LA_T4C0kAoJ') + '"'
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
