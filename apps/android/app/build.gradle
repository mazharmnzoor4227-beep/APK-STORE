plugins { id 'com.android.application' }

def releaseStorePath = System.getenv('APKSTORE_KEYSTORE_PATH')
def releaseStorePassword = System.getenv('APKSTORE_KEYSTORE_PASSWORD')
def releaseKeyAlias = System.getenv('APKSTORE_KEY_ALIAS')
def releaseKeyPassword = System.getenv('APKSTORE_KEY_PASSWORD')
def hasReleaseSigning = [releaseStorePath, releaseStorePassword, releaseKeyAlias, releaseKeyPassword].every {
    it != null && !it.trim().isEmpty()
}

android {
    namespace 'com.apkstore.client'
    compileSdk 35
    defaultConfig {
        applicationId 'com.apkstore.client'
        minSdk 26
        targetSdk 35
        versionCode 16
        versionName '1.1.8'
        buildConfigField 'String', 'SUPABASE_URL', '"https://qfbfxencwsgryoczkdyj.supabase.co"'
        buildConfigField 'String', 'SITE_URL', '"' + (project.findProperty('siteUrl') ?: 'https://mazharmnzoor4227-beep.github.io/APK-STORE/') + '"'
        // Supabase publishable keys are intentionally public client credentials; RLS controls access.
        buildConfigField 'String', 'SUPABASE_KEY', '"' + (project.findProperty('supabasePublishableKey') ?: 'sb_publishable_RiOpxFwFfj3dRt45AVn3LA_T4C0kAoJ') + '"'
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseStorePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            if (hasReleaseSigning) signingConfig signingConfigs.release
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }
}

dependencies {
    implementation 'androidx.work:work-runtime:2.12.0'
    implementation 'io.noties.markwon:core:4.6.2'
    testImplementation 'junit:junit:4.13.2'
}
