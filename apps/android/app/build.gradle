plugins { id 'com.android.application' }

def releaseStorePath = System.getenv('APKSTORE_KEYSTORE_PATH')
def releaseStorePassword = System.getenv('APKSTORE_KEYSTORE_PASSWORD')
def releaseKeyAlias = System.getenv('APKSTORE_KEY_ALIAS')
def releaseKeyPassword = System.getenv('APKSTORE_KEY_PASSWORD')
def hasReleaseSigning = [releaseStorePath, releaseStorePassword, releaseKeyAlias, releaseKeyPassword].every {
    it != null && !it.trim().isEmpty()
}

android {
    namespace 'com.apkstore.client'
    compileSdk 35
    defaultConfig {
        applicationId 'com.apkstore.client'
        minSdk 26
        targetSdk 35
        versionCode 39
        versionName '1.1.31'
        buildConfigField 'String', 'SUPABASE_URL', '"https://qfbfxencwsgryoczkdyj.supabase.co"'
        buildConfigField 'String', 'SITE_URL', '"' + (project.findProperty('siteUrl') ?: 'https://mazharmnzoor4227-beep.github.io/APK-STORE/') + '"'
        // Supabase publishable keys are intentionally public client credentials; RLS controls access.
        buildConfigField 'String', 'SUPABASE_KEY', '"' + (project.findProperty('supabasePublishableKey') ?: 'sb_publishable_RiOpxFwFfj3dRt45AVn3LA_T4C0kAoJ') + '"'
        // Google Web OAuth client ID (same one the website uses). Public identifier, not a secret.
        // Override with -PgoogleWebClientId=... if needed.
        buildConfigField 'String', 'GOOGLE_WEB_CLIENT_ID', '"' + (project.findProperty('googleWebClientId') ?: '288748828570-l16dt40bvheb9flapjv8rkrocao1sr4h.apps.googleusercontent.com') + '"'
        // AdMob IDs. Defaults are GOOGLE'S OFFICIAL TEST IDs (test ads only).
        // Inject real IDs at build time: -PadmobAppId=... -PadmobBannerId=... -PadmobNativeId=...
        buildConfigField 'String', 'ADMOB_APP_ID', '"' + (project.findProperty('admobAppId') ?: 'ca-app-pub-3940256099942544~3347511713') + '"'
        buildConfigField 'String', 'ADMOB_BANNER_ID', '"' + (project.findProperty('admobBannerId') ?: 'ca-app-pub-3940256099942544/6300978111') + '"'
        buildConfigField 'String', 'ADMOB_NATIVE_ID', '"' + (project.findProperty('admobNativeId') ?: 'ca-app-pub-3940256099942544/2247696110') + '"'
        manifestPlaceholders = [admobAppId: (project.findProperty('admobAppId') ?: 'ca-app-pub-3940256099942544~3347511713')]
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseStorePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            if (hasReleaseSigning) signingConfig signingConfigs.release
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }
}

dependencies {
    implementation 'androidx.work:work-runtime:2.12.0'
    implementation 'io.noties.markwon:core:4.6.2'
    // Google sign-in via Credential Manager (ID token -> Supabase Auth)
    implementation 'androidx.credentials:credentials:1.3.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.3.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'
    // AdMob (banner + native ads). Version verified present on dl.google.com.
    implementation 'com.google.android.gms:play-services-ads:23.6.0'
    testImplementation 'junit:junit:4.13.2'
}
