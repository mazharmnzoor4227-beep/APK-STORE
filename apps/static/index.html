<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#090d0b">
  <title>APK STORE</title>
  <link rel="stylesheet" href="./style.css">
  <script>try{document.documentElement.dataset.theme=localStorage.getItem('apk-store-theme')||'dark'}catch{}</script>
  <script src="./config.js" defer></script>
  <script src="./store.js" defer></script>
</head>
<body>
  <header class="site-header"><div class="site-container header-inner"><a href="./" class="brand"><span class="brand-icon"><span></span></span>APK<span class="brand-light">STORE</span><span class="brand-cursor">_</span></a><form id="search-form" class="header-search" role="search"><label class="sr-only" for="app-search">Search apps</label><span aria-hidden="true">⌕</span><input id="app-search" name="q" type="search" placeholder="Search apps and games"><button type="submit" aria-label="Submit search">↗</button></form><button id="theme-button" class="theme-trigger" type="button" aria-label="Toggle light and dark mode">◐</button></div><nav class="site-container store-tabs" aria-label="Store sections"><a href="./">Discover</a><a href="./?search=1">All apps</a></nav></header>
  <main id="main-content" class="site-container">
    <section id="hero" class="hero" aria-labelledby="discover-title"><div class="eyebrow"><span class="signal"></span> THE ANDROID COLLECTION</div><h1 id="discover-title">Find your next<br>favorite app<span class="green-dot">.</span></h1><p>Explore independent apps and download their latest approved release.</p></section>
    <section id="catalog" class="catalog" aria-labelledby="catalog-title"><div class="section-heading"><div><span class="section-index">DISCOVER / APPS</span><h2 id="catalog-title">Latest apps</h2></div><a href="./?search=1" class="section-more">Browse all ↗</a></div><div id="results" role="status" class="empty-state"><h3>Loading apps…</h3></div></section>
    <section id="detail" class="inner-page app-detail" hidden></section>
  </main>
  <footer class="site-footer"><div class="site-container footer-inner"><span>APK STORE <span class="green-dot">●</span></span><span>Independent apps. Direct downloads.</span></div></footer>
</body>
</html>
